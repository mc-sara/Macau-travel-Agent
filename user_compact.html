<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>澳游半日管家｜用户版单页</title>
  <style>
    :root{--bg:#f7f4ef;--card:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e8e1d8;--accent:#d9482b;--accent2:#0f766e;--soft:#fff3ed;--green:#ecfdf5;--warn:#fff7ed;--shadow:0 10px 28px rgba(31,41,51,.08);--radius:18px}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#fffaf5 0%,var(--bg) 55%,#f1fbf8 100%);color:var(--ink);font-size:13px;line-height:1.45;overflow:hidden} button,textarea{font:inherit}.page{height:100vh;padding:16px;display:grid;grid-template-rows:auto 1fr;gap:12px;max-width:1380px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;min-width:260px}.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#f97316);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 18px rgba(217,72,43,.24)}h1{font-size:20px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.4px}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.step{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.76);font-size:12px;color:#4b5563;white-space:nowrap}.step.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.grid{min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr);gap:12px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(232,225,216,.9);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;overflow:hidden}.card-head{padding:13px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title{font-size:15px;font-weight:820;margin:0;letter-spacing:-.2px}.hint{font-size:11px;color:var(--muted)}.card-body{padding:12px 14px;min-height:0}.left,.main,.right{display:flex;flex-direction:column;min-height:0}textarea{width:100%;height:98px;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;font-size:13px;line-height:1.45}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,72,43,.10)}.primary{width:100%;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 8px 16px rgba(217,72,43,.2)}.primary:disabled{opacity:.62;cursor:not-allowed}.example{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-size:12px;cursor:pointer;text-align:left;color:#374151}.example:hover{border-color:var(--accent);background:var(--soft)}.examples{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 12px}.progress-wrap{margin-top:11px;padding:10px;border-radius:14px;background:#fbfaf8;border:1px solid var(--line)}.progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}.bar{height:7px;background:#eee4dc;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f59e0b);border-radius:99px;transition:width .22s}.confirm-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.mini{padding:8px 9px;border-radius:12px;background:#f9fafb;border:1px solid #edf0f3}.mini b{display:block;font-size:11px;color:var(--muted);font-weight:650;margin-bottom:2px}.mini span{font-size:13px;font-weight:800;color:var(--ink)}.ask{margin-top:10px;padding:10px 11px;border-radius:14px;background:var(--warn);border:1px solid #fed7aa;color:#9a3412;font-size:12px}.ask b{display:block;margin-bottom:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{padding:5px 8px;border-radius:999px;background:#fff0eb;color:#b83219;font-weight:750;font-size:11px;border:1px solid #ffd6ca}.main .card-body{display:grid;grid-template-columns:1.04fr .96fr;gap:12px;overflow:hidden;height:100%}.plan-title{font-size:18px;font-weight:900;letter-spacing:-.35px;margin:0 0 4px}.score{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#111827;color:#fff;font-weight:800;font-size:11px}.timeline{margin-top:10px;border-top:1px solid var(--line)}.time-row{display:grid;grid-template-columns:50px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #f0ece7;align-items:start}.time{font-size:12px;font-weight:850;color:var(--accent)}.place{font-size:13px;font-weight:820;color:var(--ink)}.desc{font-size:11px;color:var(--muted);margin-top:2px}.routes{margin-top:10px;display:grid;gap:6px}.route{font-size:11px;color:#4b5563;background:#fbfaf8;border:1px dashed #e5ddd4;border-radius:10px;padding:7px 8px}.panel{display:flex;flex-direction:column;min-height:0;gap:9px}.reason,.risk,.available{border-radius:13px;padding:9px 10px;font-size:12px;line-height:1.4;border:1px solid transparent}.reason{background:var(--green);color:#065f46;border-color:#bbf7d0;font-weight:720}.risk{background:var(--warn);color:#9a3412;border-color:#fed7aa}.available{background:#f8fafc;color:#334155;border-color:#e2e8f0}.section-label{font-size:12px;font-weight:850;color:#374151;margin:2px 0 0}.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.budget{padding:9px;border-radius:13px;background:#f9fafb;border:1px solid #edf0f3}.budget b{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}.budget span{font-size:14px;font-weight:900}.alt-list{display:grid;gap:8px}.alt{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;cursor:pointer}.alt.active{border-color:var(--accent);background:var(--soft)}.alt h3{margin:0 0 5px;font-size:13px}.alt p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.execute-box{margin-top:10px;padding:11px;border-radius:15px;background:#fbfaf8;border:1px solid var(--line)}.orders{display:grid;gap:7px;margin-top:8px}.order{padding:8px 9px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;font-size:11px;color:#166534}.message{margin-top:8px;padding:9px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:11px;line-height:1.45}.footnote{position:fixed;right:16px;bottom:7px;font-size:10px;color:#9ca3af}.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:#fff}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:9px;margin-top:10px;font-size:12px}@media(max-width:1050px){body{overflow:auto}.page{height:auto}.grid{grid-template-columns:1fr}.main .card-body{grid-template-columns:1fr}.right{min-height:auto}.footnote{display:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div class="brand"><div class="logo">澳</div><div><h1>澳游半日管家</h1><div class="subtitle">真实后端版 · 一页完成需求确认、方案选择和模拟执行</div></div></div><div class="steps"><span class="step active">1 输入需求</span><span class="step active">2 需求确认</span><span class="step active">3 推荐方案</span><span class="step" id="step4">4 执行安排</span></div></header>
    <section class="grid">
      <aside class="card left"><div class="card-head"><h2 class="card-title">告诉我你想怎么玩</h2><span class="hint">自然语言输入</span></div><div class="card-body">
        <textarea id="need">我们几个朋友出去玩，5个人，有男有女，想去密室。</textarea>
        <div class="examples"><button class="example" data-text="今天下午2男3女想玩密室，顺便吃饭，别太贵。">朋友密室</button><button class="example" data-text="今天下午想和对象约会，浪漫一点但别太累。">情侣约会</button><button class="example" data-text="今天下午带爸妈轻松逛逛，不要爬楼梯。">带爸妈</button><button class="example" data-text="今天下午想和老婆孩子出去玩几个小时，别离家太远。">亲子轻松</button></div>
        <button class="primary" id="planBtn">开始规划</button><div id="error" class="error" hidden></div>
        <div class="progress-wrap"><div class="progress-meta"><span id="progressText">等待开始规划</span><span id="progressNum">0%</span></div><div class="bar"><span id="bar"></span></div></div>
        <div class="confirm-list"><div class="mini"><b>出行类型</b><span id="scenario">-</span></div><div class="mini"><b>总人数</b><span id="total">-</span></div><div class="mini"><b>男生</b><span id="male">-</span></div><div class="mini"><b>女生</b><span id="female">-</span></div><div class="mini"><b>活动偏好</b><span id="activity">-</span></div><div class="mini"><b>预算</b><span id="budgetLevel">中等默认</span></div></div>
        <div class="ask" id="askBox" hidden><b>还差一点信息</b><span id="askText"></span></div><div class="chips" id="chips"></div>
      </div></aside>
      <section class="card main"><div class="card-head"><div><h2 class="card-title">推荐方案</h2><span class="hint">内容压缩在一页，保留路线、理由、预算和可执行性</span></div><span class="score" id="score">- 分</span></div><div class="card-body"><div id="planLeft" class="empty">点击“开始规划”生成真实方案</div><div class="panel" id="planRight"></div></div></section>
      <aside class="card right"><div class="card-head"><h2 class="card-title">备选与执行</h2><span class="hint">可一键切换</span></div><div class="card-body"><div class="alt-list" id="altList"><div class="empty">暂无备选方案</div></div><div class="execute-box"><div class="section-label">当前选择</div><p class="hint" id="selectedText" style="margin:5px 0 10px">尚未选择</p><button class="primary" id="execBtn" disabled>开始执行安排</button><div class="orders" id="orders" hidden></div><div class="message" id="msg" hidden></div></div></div></aside>
    </section>
  </main><div class="footnote">启动：python3 web_server.py，然后打开 http://127.0.0.1:8765/</div>
<script>
const $=id=>document.getElementById(id);let lastResult=null;let selectedPlanId=null;
const labels={family:'家庭/亲子',friends:'朋友结伴',couple:'情侣约会',general:'普通出行',escape_room:'密室',indoor_activity:'室内活动',social:'朋友聚会',photo_friendly:'拍照',dinner_together:'晚餐',chat_friendly:'聊天',low_fatigue:'低疲劳',avoid_stairs:'避开楼梯',romantic:'浪漫',kid_friendly:'亲子',senior_friendly:'长辈友好',low_calorie_food:'低卡'};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setProgress(n,t){$('bar').style.width=n+'%';$('progressNum').textContent=n+'%';$('progressText').textContent=t}
function allPlans(){return lastResult?[lastResult.best_plan,...(lastResult.alternatives||[])]:[]}
function selectedPlan(){return allPlans().find(p=>p.id===selectedPlanId)||allPlans()[0]}
function renderGoal(result){const g=result.goal||{},p=g.people||{},prefs=g.preferences||[];$('scenario').textContent=labels[g.scenario]||g.scenario||'-';$('total').textContent=(p.total??'-')+' 人';$('male').textContent=p.male? p.male+' 人':'待补充';$('female').textContent=p.female? p.female+' 人':'待补充';$('activity').textContent=prefs.includes('escape_room')?'密室 / 室内':(prefs.slice(0,2).map(x=>labels[x]||x).join(' / ')||'-');$('budgetLevel').textContent=((g.structured_goal||{}).budget||{}).level||'中等默认';$('chips').innerHTML=prefs.slice(0,8).map(x=>`<span class="chip">${esc(labels[x]||x)}</span>`).join('');const qs=result.clarification_questions||[];if(result.clarification_needed&&qs.length){$('askBox').hidden=false;$('askText').textContent=qs.join('；')}else{$('askBox').hidden=true}}
function renderPlan(plan){if(!plan)return;$('score').textContent=(plan.score?.score??'-')+' 分';$('planLeft').className='';$('planLeft').innerHTML=`<h2 class="plan-title">${esc(plan.title)}</h2><div class="hint">${esc((plan.timeline||[]).map(s=>s.name).join(' → '))}</div><div class="timeline">${(plan.timeline||[]).map(s=>`<div class="time-row"><div class="time">${esc(s.time)}</div><div><div class="place">${esc(s.name)}</div><div class="desc">已纳入当前路线安排</div></div></div>`).join('')}</div><div class="routes">${(plan.routes||[]).slice(0,3).map(r=>`<div class="route"><b>${esc(r.origin)} → ${esc(r.destination)}</b> ${esc(r.duration_min)}分钟，${esc(r.route_distance_km)}km，步行${esc(r.walking_distance_m)}m。${esc(r.route_summary)}</div>`).join('')}</div>`;
$('planRight').innerHTML=`<div class="section-label">为什么这样安排</div>${(plan.score?.reasons||[]).slice(0,3).map(x=>`<div class="reason">${esc(x)}</div>`).join('')}<div class="section-label">预算与风险</div><div class="budget-grid"><div class="budget"><b>预计总预算</b><span>${esc(plan.budget?.currency||'MOP')} ${esc(plan.budget?.estimated_total??'-')}</span></div><div class="budget"><b>综合评分</b><span>${esc(plan.score?.score??'-')} 分</span></div></div>${(plan.score?.risks||[]).slice(0,2).map(x=>`<div class="risk">${esc(x)}</div>`).join('')}${(plan.availability||[]).slice(0,3).map(x=>`<div class="available">${esc(x.name||x.item_id)}：${esc(x.message||'')} ${x.available?'✅':'⚠️'}</div>`).join('')}`}
function renderAlts(){const plans=allPlans();if(!plans.length){$('altList').innerHTML='<div class="empty">暂无备选方案</div>';return}$('altList').innerHTML=plans.map((p,i)=>`<div class="alt ${p.id===selectedPlanId?'active':''}" data-id="${esc(p.id)}"><h3>${i===0?'推荐方案':'备选方案'} · ${esc(p.title)}</h3><p>${esc((p.timeline||[]).map(s=>s.name).join(' → '))}</p></div>`).join('');document.querySelectorAll('.alt').forEach(el=>el.onclick=()=>{selectedPlanId=el.dataset.id;renderPlan(selectedPlan());renderAlts();$('orders').hidden=true;$('msg').hidden=true;$('selectedText').textContent=selectedPlan().title});$('selectedText').textContent=selectedPlan()?.title||'尚未选择';$('execBtn').disabled=false}
async function plan(){try{$('error').hidden=true;$('planBtn').disabled=true;setProgress(18,'正在识别人数和关系...');await new Promise(r=>setTimeout(r,120));setProgress(48,'正在匹配活动和餐厅...');const res=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:$('need').value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'规划失败');const result=data.result||data;setProgress(100,'分析完成，已生成推荐方案');lastResult=result;selectedPlanId=result.best_plan.id;renderGoal(result);renderPlan(result.best_plan);renderAlts()}catch(e){$('error').hidden=false;$('error').textContent=e.message}finally{$('planBtn').disabled=false}}
async function execute(){try{const plan=selectedPlan();if(!plan)return;$('error').hidden=true;$('execBtn').disabled=true;const res=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:$('need').value,plan_id:plan.id,plan_result:lastResult})});const data=await res.json();if(!res.ok)throw new Error(data.error||'执行失败');$('orders').hidden=false;$('orders').innerHTML=(data.execution.bookings||[]).map(b=>`<div class="order">${esc(b.order_id)}｜${esc(b.message)}</div>`).join('');$('msg').hidden=false;$('msg').textContent='同行通知：'+(data.execution.final_message||'');$('selectedText').textContent=(data.selected_plan?.title||plan.title)+' · 已执行';$('step4').classList.add('active')}catch(e){$('error').hidden=false;$('error').textContent=e.message}finally{$('execBtn').disabled=false}}
document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{$('need').value=b.dataset.text});$('planBtn').onclick=plan;$('execBtn').onclick=execute;
</script></body></html>
