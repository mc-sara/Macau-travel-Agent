<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>银龄澳门本地生活 Agent｜用户版单页</title>
  <style>
    :root{--bg:#f7f4ef;--card:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e8e1d8;--accent:#d9482b;--accent2:#0f766e;--soft:#fff3ed;--green:#ecfdf5;--warn:#fff7ed;--shadow:0 10px 28px rgba(31,41,51,.08);--radius:18px}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#fffaf5 0%,var(--bg) 55%,#f1fbf8 100%);color:var(--ink);font-size:13px;line-height:1.45;overflow:hidden} button,textarea{font:inherit}.page{height:100vh;padding:16px;display:grid;grid-template-rows:auto 1fr;gap:12px;max-width:1380px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;min-width:260px}.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#f97316);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 18px rgba(217,72,43,.24)}h1{font-size:20px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.4px}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.step{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.76);font-size:12px;color:#4b5563;white-space:nowrap}.step.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.grid{min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr);gap:12px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(232,225,216,.9);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;overflow:hidden}.card-head{padding:13px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title{font-size:15px;font-weight:820;margin:0;letter-spacing:-.2px}.hint{font-size:11px;color:var(--muted)}.card-body{padding:12px 14px;min-height:0}.left,.main,.right{display:flex;flex-direction:column;min-height:0}textarea{width:100%;height:98px;resize:none;border:1px solid var(--... [truncated]
  </style>
  <style>
    button{border:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,opacity .15s ease;}
    button:active{transform:translateY(1px)}
    button:disabled{cursor:not-allowed;opacity:.55;box-shadow:none;filter:grayscale(.15)}
    .primary{width:100%;min-height:42px;margin-top:10px;padding:11px 14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#f97316);color:#fff;font-weight:850;letter-spacing:.2px;box-shadow:0 10px 18px rgba(217,72,43,.24)}
    .primary:hover:not(:disabled){box-shadow:0 12px 24px rgba(217,72,43,.32);transform:translateY(-1px)}
    .examples{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
    .example{min-height:34px;padding:8px 10px;border:1px solid rgba(217,72,43,.18);border-radius:999px;background:var(--soft);color:#9a3412;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 4px 10px rgba(217,72,43,.06)}
    .example:hover{background:#ffe7da;border-color:rgba(217,72,43,.34);transform:translateY(-1px)}
    .alt{border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:8px;background:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(31,41,51,.04)}
    .alt.active{border-color:var(--accent2);background:var(--green);box-shadow:0 6px 16px rgba(15,118,110,.12)}
    .alt h3{font-size:13px;margin:0 0 4px;font-weight:850}.alt p{margin:0;color:var(--muted);font-size:11px}
    .orders{max-height:220px;overflow:auto;margin-top:10px;padding-right:2px}.order{padding:8px 10px;margin:7px 0;border-radius:12px;background:#f9fafb;border:1px solid #edf0f3;font-size:11px;line-height:1.45;color:#374151}.message{margin-top:10px;padding:10px;border-radius:14px;background:var(--green);border:1px solid #bbf7d0;color:#065f46;font-size:12px;line-height:1.45}
    .right .card-body{overflow:auto}.voice-guide-highlight{margin:10px 0;padding:11px;border-radius:16px;background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #a7f3d0;box-shadow:0 8px 18px rgba(15,118,110,.10)}.voice-guide-highlight h3{margin:0 0 8px;font-size:13px;color:#065f46}.voice-block{padding:8px 9px;margin-top:7px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid rgba(15,118,110,.12);font-size:12px;line-height:1.5;color:#1f2933}.voice-block b{display:block;margin-bottom:3px;color:#0f766e}
    .footnote{position:fixed;left:18px;bottom:6px;color:#9ca3af;font-size:10px}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div class="brand"><div class="logo">龄</div><div><h1>银龄澳门本地生活 Agent</h1><div class="subtitle">真实后端版 · 低疲劳路线、适老说明和 QwenPaw 模拟执行</div></div></div><div class="steps"><span class="step active">1 输入需求</span><span class="step active">2 需求确认</span><span class="step active">3 推荐方案</span><span class="step" id="step4">4 执行安排</span></div></header>
    <section class="grid">
      <aside class="card left"><div class="card-head"><h2 class="card-title">告诉我长者出行需求</h2><span class="hint">自然语言输入</span></div><div class="card-body">
        <textarea id="need">我想带爸妈下午轻松逛逛，不想爬楼梯，最好有地方坐，晚上吃点清淡的。</textarea>
        <div class="examples"><button class="example" data-text="我想带爸妈下午轻松逛逛，不想爬楼梯，最好有地方坐，晚上吃点清淡的。">带爸妈轻松逛</button><button class="example" data-text="下午带爷爷奶奶在澳门走走，路不要太长，中途最好有厕所和座椅。">厕所和休息点</button><button class="example" data-text="如果下午下雨，想带妈妈找室内地方慢慢逛，少走路，晚饭不要太油。">雨天室内适老</button><button class="example" data-text="外婆走路慢，最好全程有电梯或无障碍通道，可以安排一条轻松路线吗？">电梯无障碍</button></div>
        <button class="primary" id="planBtn">开始规划</button><div id="error" class="error" hidden></div>
        <div class="progress-wrap"><div class="progress-meta"><span id="progressText">等待开始规划</span><span id="progressNum">0%</span></div><div class="bar"><span id="bar"></span></div></div>
        <div class="confirm-list"><div class="mini"><b>出行类型</b><span id="scenario">-</span></div><div class="mini"><b>总人数</b><span id="total">-</span></div><div class="mini"><b>长者人数</b><span id="male">-</span></div><div class="mini"><b>步行限制</b><span id="female">-</span></div><div class="mini"><b>适老偏好</b><span id="activity">-</span></div><div class="mini"><b>预算</b><span id="budgetLevel">中等默认</span></div></div>
        <div class="ask" id="askBox" hidden><b>还差一点信息</b><span id="askText"></span></div><div class="chips" id="chips"></div>
      </div></aside>
      <section class="card main"><div class="card-head"><div><h2 class="card-title">推荐方案</h2><span class="hint">内容压缩在一页，保留低疲劳路线、适老理由、预算和可执行性</span></div><span class="score" id="score">- 分</span></div><div class="card-body"><div id="planLeft" class="empty">点击“开始规划”生成真实方案</div><div class="panel" id="planRight"></div></div></section>
      <aside class="card right"><div class="card-head"><h2 class="card-title">备选与执行</h2><span class="hint">可一键切换</span></div><div class="card-body"><div class="alt-list" id="altList"><div class="empty">暂无备选方案</div></div><div class="execute-box"><div class="section-label">当前选择</div><p class="hint" id="selectedText" style="margin:5px 0 10px">尚未选择</p><button class="primary" id="execBtn" disabled>开始执行安排</button><div class="orders" id="orders" hidden></div><div class="message" id="msg" hidden></div></div></div></aside>
    </section>
  </main><div class="footnote">启动：python3 web_server.py，然后打开 http://127.0.0.1:8899/</div>
<script>
const $=id=>document.getElementById(id);let lastResult=null;let selectedPlanId=null;const ttsCache=new Map();
const labels={senior:'银龄出行',family:'银龄家庭',general:'适老出行',low_fatigue:'低疲劳',short_walking_distance:'少步行',avoid_stairs:'避开楼梯',senior_friendly:'长者友好',low_calorie_food:'清淡饮食',rest_area:'休息点',toilet_access:'厕所方便',flat_route:'平缓路线',wheelchair_friendly:'无障碍',elevator_required:'电梯优先',indoor_required:'室内优先',simple_transport:'交通简单',route_card_needed:'路线卡',oral_guide_needed:'语音导游'};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setProgress(n,t){$('bar').style.width=n+'%';$('progressNum').textContent=n+'%';$('progressText').textContent=t}
function allPlans(){return lastResult?[lastResult.best_plan,...(lastResult.alternatives||[])]:[]}
function selectedPlan(){return allPlans().find(p=>p.id===selectedPlanId)||allPlans()[0]}
function renderGoal(result){const g=result.goal||{},p=g.people||{},prefs=g.preferences||[];$('scenario').textContent=labels[g.scenario]||g.scenario||'-';$('total').textContent=(p.total??'-')+' 人';$('male').textContent=(p.seniors??0)? p.seniors+' 人':'待补充';$('female').textContent=prefs.includes('short_walking_distance')?'少步行':(prefs.includes('avoid_stairs')?'避开楼梯':'待补充');$('activity').textContent=(prefs.slice(0,3).map(x=>labels[x]||x).join(' / ')||'长者友好');$('budgetLevel').textContent=((g.structured_goal||{}).budget||{}).level||'中等默认';$('chips').innerHTML=prefs.slice(0,8).map(x=>`<span class="chip">${esc(labels[x]||x)}</span>`).join('');const qs=result.clarification_questions||[];if(result.clarification_needed&&qs.length){$('askBox').hidden=false;$('askText').textContent=qs.join('；')}else{$('askBox').hidden=true}}
function renderPlan(plan){if(!plan)return;$('score').textContent=(plan.score?.score??'-')+' 分';$('planLeft').className='';$('planLeft').innerHTML=`<h2 class="plan-title">${esc(plan.title)}</h2><div class="hint">${esc((plan.timeline||[]).map(s=>s.name).join(' → '))}</div><div class="timeline">${(plan.timeline||[]).map(s=>`<div class="time-row"><div class="time">${esc(s.time)}</div><div><div class="place">${esc(s.name)}</div><div class="desc">已纳入当前路线安排</div></div></div>`).join('')}</div><div class="routes">${(plan.routes||[]).slice(0,3).map(r=>`<div class="route"><b>${esc(r.origin)} → ${esc(r.destination)}</b> ${esc(r.duration_min)}分钟，${esc(r.route_distance_km)}km，步行${esc(r.walking_distance_m)}m。${esc(r.route_summary)}</div>`).join('')}</div>`;
$('planRight').innerHTML=`<div class="section-label">为什么这样安排</div>${(plan.score?.reasons||[]).slice(0,3).map(x=>`<div class="reason">${esc(x)}</div>`).join('')}<div class="section-label">预算与风险</div><div class="budget-grid"><div class="budget"><b>预计总预算</b><span>${esc(plan.budget?.currency||'MOP')} ${esc(plan.budget?.estimated_total??'-')}</span></div><div class="budget"><b>综合评分</b><span>${esc(plan.score?.score??'-')} 分</span></div></div>${(plan.score?.risks||[]).slice(0,2).map(x=>`<div class="risk">${esc(x)}</div>`).join('')}${(plan.availability||[]).slice(0,3).map(x=>`<div class="available">${esc(x.name||x.item_id)}：${esc(x.message||'')} ${x.available?'✅':'⚠️'}</div>`).join('')}`}
function renderAlts(){const plans=allPlans();if(!plans.length){$('altList').innerHTML='<div class="empty">暂无备选方案</div>';return}$('altList').innerHTML=plans.map((p,i)=>`<div class="alt ${p.id===selectedPlanId?'active':''}" data-id="${esc(p.id)}"><h3>${i===0?'推荐方案':'备选方案'} · ${esc(p.title)}</h3><p>${esc((p.timeline||[]).map(s=>s.name).join(' → '))}</p></div>`).join('');document.querySelectorAll('.alt').forEach(el=>el.onclick=()=>{selectedPlanId=el.dataset.id;renderPlan(selectedPlan());renderAlts();$('orders').hidden=true;$('msg').hidden=true;$('selectedText').textContent=selectedPlan().title});$('selectedText').textContent=selectedPlan()?.title||'尚未选择';$('execBtn').disabled=false}
async function plan(){try{$('error').hidden=true;$('planBtn').disabled=true;setProgress(18,'正在识别长者人数和出行约束...');await new Promise(r=>setTimeout(r,120));setProgress(48,'正在匹配适老路线和清淡餐厅...');const res=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:$('need').value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'规划失败');const result=data.result||data;setProgress(100,'分析完成，已生成推荐方案');lastResult=result;selectedPlanId=result.best_plan.id;renderGoal(result);renderPlan(result.best_plan);renderAlts()}catch(e){$('error').hidden=false;$('error').textContent=e.message}finally{$('planBtn').disabled=false}}
async function buildTtsAudio(text,language,slot){text=String(text||'').trim();if(!text){slot.innerHTML='<div class="order">暂无可播报文本</div>';return}const key=language+'::'+text;if(ttsCache.has(key)){const url=ttsCache.get(key);slot.innerHTML=`<audio controls src="${esc(url)}" style="width:100%;margin-top:8px"></audio><div class="hint">已使用缓存音频，未重复扣费</div>`;slot.querySelector('audio')?.play?.();return}slot.innerHTML='<div class="order">正在生成语音，请稍候...</div>';const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language})});const data=await res.json();if(!res.ok)throw new Error(data.error||'语音生成失败');const url=data.audio?.audio_url;if(!url)throw new Error('语音接口未返回 audio_url');ttsCache.set(key,url);slot.innerHTML=`<audio controls src="${esc(url)}" style="width:100%;margin-top:8px"></audio><div class="hint">已生成并缓存本次音频</div>`;slot.querySelector('audio')?.play?.()}
function bindTtsButtons(guide){document.querySelectorAll('[data-tts-lang]').forEach(btn=>btn.onclick=async()=>{const lang=btn.dataset.ttsLang;const text=lang==='cantonese'?guide.cantonese:guide.mandarin;const slot=document.getElementById('tts-'+lang);btn.disabled=true;try{await buildTtsAudio(text,lang,slot)}catch(e){slot.innerHTML=`<div class="risk">${esc(e.message)}</div>`}finally{btn.disabled=false}})}
async function execute(){try{const plan=selectedPlan();if(!plan)return;$('error').hidden=true;$('execBtn').disabled=true;const res=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:$('need').value,plan_id:plan.id,plan_result:lastResult})});const data=await res.json();if(!res.ok)throw new Error(data.error||'执行失败');const ex=data.execution||{};const card=ex.route_card||{};const guide=ex.oral_guide||{};const actions=ex.qwenpaw_actions||[];$('orders').hidden=false;$('orders').innerHTML=`<div class="voice-guide-highlight"><h3>🎧 普通话 / 粤语语音导游词</h3><div class="voice-block"><b>普通话</b>${esc(guide.mandarin||'暂无普通话导游词')}<br><button class="example" data-tts-lang="mandarin" style="margin-top:8px">播放普通话</button><div id="tts-mandarin"></div></div><div class="voice-block"><b>粤语</b>${esc(guide.cantonese||'暂无粤语导游词')}<br><button class="example" data-tts-lang="cantonese" style="margin-top:8px">播放粤语</button><div id="tts-cantonese"></div></div></div>`+(ex.bookings||[]).map(b=>`<div class="order">${esc(b.order_id)}｜${esc(b.message)}</div>`).join('')+`<div class="order"><b>三句话路线卡</b><br>① ${esc(card.boarding_instruction||'')}<br>② ${esc(card.dropoff_instruction||'')}<br>③ ${esc(card.walking_instruction||'')}</div>`+actions.map(a=>`<div class="order">${esc(a.channel)}｜${esc(a.status)}｜${esc(a.summary)}</div>`).join('');$('msg').hidden=false;$('msg').textContent='QwenPaw 家属通知：'+(ex.final_message||'');$('selectedText').textContent=(data.selected_plan?.title||plan.title)+' · 已执行';$('step4').classList.add('active');$('orders').scrollTop=0;bindTtsButtons(guide)}catch(e){$('error').hidden=false;$('error').textContent=e.message}finally{$('execBtn').disabled=false}}
document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{$('need').value=b.dataset.text});$('planBtn').onclick=plan;$('execBtn').onclick=execute;
</script></body></html>
